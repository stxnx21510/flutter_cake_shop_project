name: flutter_cake_shop_project
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2
  flutter_map: ^8.3.2
  url_launcher: ^6.3.3
  latlong2: ^0.10.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    